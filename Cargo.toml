[package]
name = "ds"
version = "0.1.2"
edition = "2021"

[[bin]]
name = "dropserve"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = "0.4"
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "5.0"
rand = "0.8"
regex = "1.11"
walkdir = "2.5"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
